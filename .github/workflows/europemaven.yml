# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information, see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

permissions:
  contents: read
  pages: write
  id-token: write

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout Repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Configure GitHub Pages
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      # Set up Java
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Execute Tests
      - name: Build Project
        run: mvn clean test

      # Install Allure CLI directly (no Docker) — replaces the broken simple-elf Docker action
      - name: Install Allure CLI
        if: always()
        run: |
          ALLURE_VERSION=2.29.0
          curl -sL -o allure.tgz https://github.com/allure-framework/allure2/releases/download/${ALLURE_VERSION}/allure-${ALLURE_VERSION}.tgz
          sudo tar -zxf allure.tgz -C /opt/
          sudo ln -sf /opt/allure-${ALLURE_VERSION}/bin/allure /usr/local/bin/allure
          allure --version

      # Generate the Allure HTML report from the results the tests produced
      - name: Generate Allure Report
        if: always()
        run: |
          if [ -d "allure-results" ] && [ "$(ls -A allure-results 2>/dev/null)" ]; then
            allure generate allure-results --clean -o allure-report
          else
            echo "No allure-results were produced by the build; creating a placeholder report."
            mkdir -p allure-report
            echo "<html><body><h2>No Allure results were produced by this build.</h2><p>Check the Build Project step logs.</p></body></html>" > allure-report/index.html
          fi

      # Zip the Allure report folder (password-encrypted) so Gmail does not block it.
      # Gmail scans inside plain zips and blocks HTML/JS content (552-5.7.0); it cannot
      # scan an encrypted archive, so an encrypted zip is delivered normally.
      - name: Zip Allure Report
        if: always()
        run: |
          if [ -d "allure-report" ]; then
            zip -r -P "eAmata@2026" allure-report.zip allure-report
          else
            echo "allure-report folder not found" && exit 1
          fi

      # Email the zipped Allure report
      - name: Email Allure Report
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Allure Report - ${{ github.repository }} - Build #${{ github.run_number }} (${{ job.status }})"
          to: yogesh.jadhav@thinkitive.com
          from: eAmata CI <${{ secrets.MAIL_USERNAME }}>
          body: |
            Hi Yogesh,

            The Allure test report for the latest build is attached.

            Repository : ${{ github.repository }}
            Branch     : ${{ github.ref_name }}
            Commit     : ${{ github.sha }}
            Build #    : ${{ github.run_number }}
            Status     : ${{ job.status }}
            Run URL    : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            The attached allure-report.zip is password-protected (Gmail blocks plain zipped HTML reports).
            Attachment password: eAmata@2026

            -- eAmata CI
          attachments: allure-report.zip

      # Upload GitHub Pages Artifact
      - name: Upload GitHub Pages Artifact
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report

      # Upload Surefire Reports
      - name: Upload Surefire Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/

      # Upload Cucumber Reports
      - name: Upload Cucumber Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report
          path: target/cucumber-reports/

  deploy:
    needs: build

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
